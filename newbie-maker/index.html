<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>신입사원 메이커: 20년 후의 나 — 프로토타입 v4</title>
<style>
  :root{
    --blue:#1f5fd6; --blue-d:#164aa8; --sky:#eaf2ff; --ink:#1b2437;
    --line:#d6e0f2; --ok:#1f9d57; --bad:#d64545; --gold:#e2a400; --paper:#fbfdff;
    --purple:#7a5cf0; --kipi:#0d8f8f; --pink:#d6457f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:linear-gradient(160deg,#f3f7ff,#e7eefb);color:var(--ink);min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:22px;box-shadow:0 10px 30px -18px rgba(31,95,214,.5);margin-bottom:16px}
  h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 12px;color:var(--blue-d)}
  .sub{color:#6b7791;font-size:13px;margin:0 0 18px;line-height:1.5}
  .badge{display:inline-block;background:var(--sky);color:var(--blue-d);
    font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:10px;font-weight:700}
  .badge.cat{background:#f0ecff;color:var(--purple)}
  .badge.kipi{background:#e0f5f5;color:var(--kipi)}
  .badge.event{background:#fff0e0;color:#c8791a}
  label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#42506b}
  input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;font-size:15px;background:#fff}
  button{cursor:pointer;font-family:inherit}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:11px;
    padding:13px 18px;font-size:15px;font-weight:700;width:100%;transition:.15s}
  .btn:hover{background:var(--blue-d)} .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue)}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .choice{text-align:left;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;padding:13px 15px;font-size:14.5px;transition:.12s;line-height:1.45}
  .choice:hover{border-color:var(--blue);background:var(--sky)}
  .choice .whisper{display:block;font-size:12px;color:#8a94a8;margin-top:4px;font-style:italic}
  .prog{height:8px;background:#e3ebf9;border-radius:99px;overflow:hidden;margin:2px 0 16px}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#4d88f0);width:0;transition:.3s}
  .turnmeta{display:flex;justify-content:space-between;font-size:12px;color:#6b7791;margin-bottom:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:6px}
  .radar{display:block;margin:4px auto 2px;width:100%;max-width:340px;height:auto}
  .hpmp{margin-top:10px}
  .stat{font-size:12.5px}
  .stat .bar{height:7px;background:#e8eefb;border-radius:99px;overflow:hidden;margin-top:3px}
  .stat .bar>i{display:block;height:100%;background:var(--blue)}
  .stat.hp .bar>i{background:var(--ok)} .stat.mp .bar>i{background:var(--gold)}
  .fx{font-size:13px;margin-top:10px;padding:11px 13px;border-radius:9px;background:#f2f6ff;line-height:1.5}
  .fx .rx{display:block;color:var(--purple);font-size:13px;margin-bottom:6px}
  .fx b.up{color:var(--ok)} .fx b.dn{color:var(--bad)} .fx b.it{color:var(--pink)}
  .charcard{background:linear-gradient(135deg,#20304d,#2d5bbf);color:#fff;border-radius:16px;
    padding:22px 20px;margin:8px 0 16px;text-align:center}
  .charcard .emoji{font-size:46px;line-height:1}
  .charcard .cname{font-size:22px;font-weight:800;margin:8px 0 6px}
  .charcard .cdesc{font-size:13.5px;opacity:.95;line-height:1.55}
  .charcard .grade{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 16px;font-weight:800;font-size:15px}
  .traits{display:flex;flex-direction:column;gap:9px;margin:6px 0 2px}
  .traxis{font-size:12px}
  .traxis .lab{display:flex;justify-content:space-between;color:#6b7791;margin-bottom:3px}
  .traxis .lab b{color:var(--ink)}
  .trbar{position:relative;height:8px;background:#eef2fb;border-radius:99px}
  .trbar .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;
    border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .insight{border-radius:13px;padding:14px 16px;margin:10px 0;line-height:1.55}
  .insight .h{font-size:12.5px;font-weight:800;margin-bottom:4px}
  .insight.good{background:#eafaf1;border:1px solid #bfe8cf} .insight.good .h{color:var(--ok)}
  .insight.like{background:#fdeef5;border:1px solid #f4cfe0} .insight.like .h{color:var(--pink)}
  .insight.hard{background:#fdeeee;border:1px solid #f4cccc} .insight.hard .h{color:var(--bad)}
  .insight .big{font-size:15px;font-weight:800;color:var(--ink)}
  .insight .side{font-size:12.5px;color:#4a5468;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:#6b7791;font-size:12px;font-weight:700}
  tr.me{background:var(--sky);font-weight:800}
  .rank{font-weight:800;color:var(--blue-d);width:38px}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 .btn{flex:1}
  .muted{color:#8a94a8;font-size:12px;text-align:center;margin-top:14px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .dexcell{border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-size:11.5px;background:#fff}
  .dexcell.got{border-color:var(--blue);background:var(--sky);font-weight:700}
  .dexcell .de{font-size:22px;line-height:1.1} .dexcell.miss{color:#b9c1d1}
</style>
</head>

<script>
/* ============================================================
   신입사원 메이커 — 프로토타입 v4
   변경점(v3 → v4):
   1) 문항에 measure 태그: strength(능력치 반영) / interest(끌리는 업무만) / stress(멘탈만)
   2) 성향 축 3개: social(내향-↔외향+) / novelty(안정-↔변화+) / belonging(자유-↔조직+)
   3) 결과 3분리: 💪잘하는 업무 / ❤️끌리는 업무 / 💢힘든 이유
   4) 캐릭터 판정: (강점 base 7종 + 성향 프리픽스) + 특수(한량/균형) → 균형형 쏠림 해결
   5) 점수 등급제 S/A/B/C/D (우열 아닌 '완성도' 관점) + 캐릭터 도감
   6) 문항 42개(kipi13·psych20·event9), 추가문항 4 + RFID 반영
   ============================================================ */

const STAT_KEYS = ["기획력","소통력","행정력","디지털","조직이해도","창의력"];
const START_STAT = 25, START_HPMP = 100, TURNS = 15;

  행정력:{job:"기획조정·예산·규정", line:"절차와 기준을 단단히 지키는 일"},

  창의력:{job:"신사업·서비스기획", line:"아무도 안 한 방식을 시도하는 일"},

const PAIN = {
  낮은멘탈:"거절을 잘 못 해서, 일이 자꾸 나에게 몰려요.",

  행정력:"규정·절차가 자꾸 발목을 잡는 것처럼 느껴져요.",
  디지털:"새 시스템·AI 도구 익히라는 말이 제일 큰 스트레스예요.",
  조직이해도:"이 일을 왜 하는지 몰라서 의욕이 안 나요.",

};

/* ---------- 캐릭터 (강점 base 6 + 특수 2) ---------- */
const BASE_CHAR = {
  기획력:{e:"🧭",name:"전략 기획가",desc:"판을 짜고 방향을 잡는 사람. 큰 그림이 보이면 손이 근질근질해요."},
  소통력:{e:"🤝",name:"조율의 커넥터",desc:"사람과 부서를 잇는 사람. 당신이 있으면 이야기가 굴러갑니다."},
  행정력:{e:"🛡️",name:"규정의 수호자",desc:"절차와 기준으로 조직을 지키는 사람. 흔들려도 원칙은 안 흔들려요."},
  디지털:{e:"🤖",name:"디지털 개척자",desc:"시스템·데이터·AI로 일하는 방식을 바꾸는 사람. 복잡할수록 눈이 반짝여요."},
  조직이해도:{e:"🧩",name:"조직의 조율자",desc:"전체 흐름을 읽고 사이를 메우는 사람. 조직이 잘 굴러가면 뿌듯하죠."},
  창의력:{e:"💡",name:"아이디어 뱅크",desc:"아무도 안 한 방식을 던지는 사람. 지루한 건 못 참아요."},

  한량:{e:"🕊️",name:"오늘도 7시에 출근한 한량",
    desc:"조선시대였다면 대청마루에서 유유자적했을 사람. 마음은 파이어족, 몸은 새벽 7시 정각 출근. 그래도 월급값은 합니다 — 남한테 피해는 못 주죠."},
  균형:{e:"⚖️",name:"균형 잡힌 만능 실무가",
    desc:"어느 하나 빠지지 않는 올라운더. 어디에 놔둬도 제 몫을 해내는 사람이에요."},
};
const DEX_ORDER = ["기획력","소통력","행정력","디지털","조직이해도","창의력","균형","한량"];
/* 성향 프리픽스 (가장 강한 축) */
function traitPrefix(tr){
  const cand=[
    {v:-tr.social, key:"social-", txt:"묵묵한 🌙"},
    {v: tr.social, key:"social+", txt:"사람 좋아하는 ☀️"},
    {v: tr.novelty,key:"nov+",    txt:"지루함을 못 참는 🌊"},
    {v:-tr.novelty,key:"nov-",    txt:"든든한 🪨"},
  ].sort((a,b)=>b.v-a.v)[0];
  return cand.v>=4 ? cand.txt+" " : "";
}

   str: eff(능력치) 반영 · int: like(끌리는 업무만) · stress: 멘탈만
   ============================================================ */
const Q = [

{g:"kipi",m:"str",cat:"KIPRIS 검색서비스",q:"[KIPRIS] 국민이 쓰는 특허검색 서비스에 새 기능을 넣는다면?",opts:[

  {t:"검색 결과 화면을 더 쉽게",eff:{기획력:2,소통력:1},whisper:"쉬운 게 최고"},
  {t:"데이터 정확도·속도 개선",eff:{디지털:3},tr:{social:-1},whisper:"기본이 튼튼해야"},
  {t:"초보자 가이드·상담 연계",eff:{소통력:2,조직이해도:1},tr:{social:1},whisper:"친절하게"}]},
{g:"kipi",m:"str",cat:"상표 이미지 검색 AI",q:"[상표 이미지 검색] 이미지로 유사상표를 찾는 AI를 도입한다. 당신의 관심사는?",opts:[
  {t:"모델 정확도와 학습데이터",eff:{디지털:4},tr:{social:-1},whisper:"성능이 핵심"},
  {t:"사용자에게 어떻게 보여줄지",eff:{기획력:2,창의력:1},whisper:"경험이 중요"},
  {t:"오탐 시 민원·책임 범위",eff:{행정력:3},tr:{novelty:-1},whisper:"리스크부터"},
  {t:"현업 담당자 의견 수렴",eff:{소통력:2,조직이해도:1},tr:{social:1},whisper:"현장을 알아야"}]},
{g:"kipi",m:"str",cat:"개도국 ODA",q:"[개도국 ODA] 베트남에 특허행정시스템을 수출하는 사업. 당신의 역할은?",opts:[

/* ---------- 엔딩(급) — 점수 등급용 참고 ---------- */
function balanced(g){ // g=성장분 배열
  const v=STAT_KEYS.map(k=>g[k]); const m=v.reduce((a,b)=>a+b,0)/v.length;
  const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/v.length);
  return sd<=3.2 && m>=6;
}

/* ---------- 시드 + 균형 뽑기 ---------- */
function hashSeed(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
function shuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTurns(seed){
  const rnd=hashSeed(seed);
  const g={kipi:[],event:[],pint:[],pstress:[],pstr:[]};
  Q.forEach((q,i)=>{
    if(q.g==="kipi")g.kipi.push(i);
    else if(q.g==="event")g.event.push(i);
    else if(q.m==="int")g.pint.push(i);
    else if(q.m==="stress")g.pstress.push(i);
    else g.pstr.push(i);
  });
  // 15문항 = 회사현안6 + 성향7(흥미1+스트레스1+강점5) + 돌발2 (끌리는 일·힘든 이유가 매판 최소 1개씩)
  let p=shuffle(g.kipi,rnd).slice(0,6)
    .concat(shuffle(g.pint,rnd).slice(0,1))
    .concat(shuffle(g.pstress,rnd).slice(0,1))
    .concat(shuffle(g.pstr,rnd).slice(0,5))
    .concat(shuffle(g.event,rnd).slice(0,2));
  return shuffle(p,rnd);
}

/* ---------- 상태 ---------- */
let G=null;
function newGame(nick,seed){
  const s={}; STAT_KEYS.forEach(k=>s[k]=START_STAT); s.hp=START_HPMP; s.mp=START_HPMP;
  const like={}; STAT_KEYS.forEach(k=>like[k]=0);
  G={nick,seed,stats:s,like,trait:{social:0,novelty:0,belonging:0},
     turns:buildTurns(seed),t:0,burnout:0,startTime:Date.now(),log:[],painPick:null};
}

/* ---------- 점수 + 등급 ---------- */
function scoreOf(s,burnout){
  const vals=STAT_KEYS.map(k=>s[k]).sort((a,b)=>b-a);
  let A=0; vals.forEach((v,i)=>A+=v*(i<3?1.3:1.0));
  const spec=vals[0]>=45?90:0; // 특화 보너스
  const E=burnout*80; // 번아웃(멘탈/체력 0 소진) 페널티
  // 멘탈/체력 '잔량'은 점수에 넣지 않음 → 몸 사리는 게 이득이 되지 않게. 점수는 능력치 성장이 결정.
  return Math.max(0,Math.round(A*2.7 + spec - E));
}
function gradeOf(sc){ return sc>=980?"S":sc>=880?"A":sc>=780?"B":sc>=680?"C":"D"; }

/* ---------- 캐릭터 판정 ---------- */
function decideChar(growth, trait){
  // 1) 한량: 자유 성향(belonging 낮음)이 뚜렷
  if(trait.belonging<=-4) return {id:"한량", ...SPECIAL.한량};
  // 2) 균형: 성장이 고름
  if(balanced(growth)) {
    const pre=traitPrefix(trait);
    return {id:"균형", e:SPECIAL.균형.e, name:pre+SPECIAL.균형.name, desc:SPECIAL.균형.desc};
  }
  // 3) 최고 강점 base + 성향 프리픽스
  const top=STAT_KEYS.slice().sort((a,b)=>growth[b]-growth[a])[0];
  const base=BASE_CHAR[top]; const pre=traitPrefix(trait);
  return {id:top, e:base.e, name:pre+base.name, desc:base.desc};
}

function addDex(id){const d=loadDex(); d[id]=(d[id]||0)+1; localStorage.setItem(dexKey(),JSON.stringify(d)); return d;}

/* ---------- 리더보드 ---------- */
function lbKey(seed){return "nm4_lb_"+seed;}
function loadLB(seed){try{return JSON.parse(localStorage.getItem(lbKey(seed)))||[];}catch(e){return[];}}
function saveScore(seed,e){const lb=loadLB(seed);lb.push(e);lb.sort((a,b)=>b.score-a.score||a.time-b.time);
  localStorage.setItem(lbKey(seed),JSON.stringify(lb.slice(0,50)));return lb.findIndex(x=>x.id===e.id);}

  const seed = seedInput || randSeed(); // 대회 코드 없으면 매번 다른 문항
  newGame(nick,seed); screenTurn();
}
function randSeed(){ return "연습-"+Math.floor(Math.random()*1e9).toString(36); }
function startRandom(){
  const nick=(document.getElementById("nick").value||"익명").trim().slice(0,12)||"익명";
  newGame(nick, randSeed()); screenTurn();
}
function start2rand(){ newGame(G.nick, randSeed()); screenTurn(); }
const RADAR_LABEL={기획력:"기획",소통력:"소통",행정력:"행정",디지털:"디지털",조직이해도:"조직",창의력:"창의"};
function statHpMp(s){
  return `<div class="stat mp"><span>멘탈 <b>${s.mp}</b></span><div class="bar"><i style="width:${Math.max(0,s.mp)}%"></i></div></div>`
    +`<div class="stat hp"><span>체력 <b>${s.hp}</b></span><div class="bar"><i style="width:${Math.max(0,s.hp)}%"></i></div></div>`;
}
function energyStyle(mp, burnout){
  if(burnout>0) return {e:"🥵",name:"과열 주의",desc:"에너지를 다 써버린 적이 "+burnout+"번. 열심히 한 만큼, 가끔은 쉬어가도 괜찮아요."};
  if(mp>=60) return {e:"🌿",name:"페이스 조절형",desc:"지치지 않고 꾸준히 가는, 오래가는 스타일이에요."};
  if(mp>=30) return {e:"⚖️",name:"균형형",desc:"쏟을 땐 쏟고 챙길 땐 챙기는, 균형 잡힌 스타일이에요."};
  return {e:"🔥",name:"열정 몰입형",desc:"에너지를 아낌없이 쏟았네요. 제대로 불태우는 사람!"};
}
function drawRadar(id,s){
  const cv=document.getElementById(id); if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W/2,H/2)-52,N=STAT_KEYS.length,MAX=30;
  const gv=k=>Math.max(0,s[k]-START_STAT); // 성장분(0부터 자라남)
  ctx.clearRect(0,0,W,H);
  for(let ring=1;ring<=4;ring++){const r=R*ring/4;ctx.beginPath();
    for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();ctx.strokeStyle='#e0e8f6';ctx.lineWidth=1;ctx.stroke();}
  ctx.font='600 20px "Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#e0e8f6';ctx.stroke();
    const lx=cx+(R+30)*Math.cos(a),ly=cy+(R+22)*Math.sin(a);
    ctx.fillStyle='#42506b';ctx.fillText(RADAR_LABEL[STAT_KEYS[i]]+" +"+gv(STAT_KEYS[i]),lx,ly);}
  ctx.beginPath();
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,v=Math.min(MAX,gv(STAT_KEYS[i]))/MAX,r=R*v,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.closePath();ctx.fillStyle='rgba(31,95,214,.25)';ctx.fill();ctx.strokeStyle='#1f5fd6';ctx.lineWidth=2.5;ctx.stroke();
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,v=Math.min(MAX,gv(STAT_KEYS[i]))/MAX,r=R*v,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#1f5fd6';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
}
function bClass(g){return g==="kipi"?"kipi":(g==="event"?"event":"cat");}

function screenTurn(){
  if(G.t>=G.turns.length) return screenResult();
  const c=Q[G.turns[G.t]]; const pct=Math.round(G.t/G.turns.length*100);
  el(`
  <div class="card">
    <div class="turnmeta"><span>${G.t+1} / ${G.turns.length}턴</span><span>${G.nick} · ${G.seed}</span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <span class="badge ${bClass(c.g)}">${c.cat}</span>
    <h2 style="min-height:46px">${c.q}</h2>
    <div class="choices">${c.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})">${o.t}
      ${o.whisper?`<span class="whisper">“${o.whisper}”</span>`:``}</button>`).join("")}</div>
  </div>
  <div class="card"><h2>능력치</h2>
    <canvas id="radarTurn" width="620" height="400" class="radar"></canvas>
    <div class="stats hpmp">${statHpMp(G.stats)}</div></div>`);
  drawRadar("radarTurn", G.stats);
}

function choose(i){
  const c=Q[G.turns[G.t]]; const o=c.opts[i]; const ch=[];
  if(c.m==="str" && o.eff) applyEff(o.eff,ch);
  if(c.m==="int" && o.like){ for(const k in o.like){ G.like[k]+=o.like[k]; ch.push([k,"it",o.like[k]]); } }
  if(c.m==="stress" && o.pain){ G.painPick=o.pain; ch.push(["나를 지치게 하는 걸 알았어요","note",0]); }
  if(o.tr){ for(const a in o.tr) G.trait[a]=(G.trait[a]||0)+o.tr[a]; }
  G.stats.mp=clamp(G.stats.mp-3); ch.push(["멘탈(업무 피로)","dn",3]); // 매 턴 기본 소모
  if(typeof o.mp==="number"){ const d=Math.round(o.mp*1.7); G.stats.mp=clamp(G.stats.mp+d); ch.push(["멘탈",d>0?"up":"dn",Math.abs(d)]); }
  G.stats.hp=clamp(G.stats.hp-2); ch.push(["체력(업무 피로)","dn",2]); // 매 턴 기본 소모
  if(typeof o.hp==="number"){ const d=Math.round(o.hp*1.7); G.stats.hp=clamp(G.stats.hp+d); ch.push(["체력",d>0?"up":"dn",Math.abs(d)]); }
  if(G.stats.mp<=0||G.stats.hp<=0){ G.burnout++; G.stats.mp=clamp(G.stats.mp+20); G.stats.hp=clamp(G.stats.hp+20); }
  G.log.push({q:G.turns[G.t],c:i}); G.t++;
  screenFeedback(ch,o.whisper,c.m);
}
function applyEff(eff,ch){ for(const k in eff){ if(STAT_KEYS.includes(k)){ const d=Math.round(eff[k]*1.8); G.stats[k]=Math.max(0,G.stats[k]+d); if(d) ch.push([k,d>0?"up":"dn",Math.abs(d)]); } } }
function clamp(v){return Math.max(0,Math.min(100,v));}

function screenFeedback(ch,whisper,m){
  const txt=ch.length?ch.map(c=>{
    if(c[1]==="note") return `<b style="color:var(--bad)">💢 ${c[0]}</b>`;
    if(c[1]==="it") return `${c[0]} <b class="it">관심 ♥</b>`;
    return `${c[0]} <b class="${c[1]}">${c[1]==="up"?"+":"−"}${c[2]}</b>`;
  }).join(" · "):"기록됨";
  el(`
  <div class="card">
    <div class="badge">${G.t} / ${G.turns.length}턴 완료</div>
    <h2>선택 결과</h2>
    <div class="fx">${whisper?`<span class="rx">“${whisper}”</span>`:``}${txt}</div>
    <div style="height:14px"></div>
    <button class="btn" onclick="screenTurn()">${G.t>=G.turns.length?"결과 확인 ▶":"다음 ▶"}</button>
  </div>`);
}

function traitAxis(label,neg,pos,val){ // val -N..+N → 위치 %
  const pos_=Math.max(0,Math.min(100, 50 + val*6));
  return `<div class="traxis"><div class="lab"><span>${neg}</span><b>${label}</b><span>${pos}</span></div>
    <div class="trbar"><div class="dot" style="left:${pos_}%"></div></div></div>`;
}

function screenResult(){
  const s=G.stats, tr=G.trait;
  const growth={}; STAT_KEYS.forEach(k=>growth[k]=s[k]-START_STAT);
  const gsorted=STAT_KEYS.slice().sort((a,b)=>growth[b]-growth[a]);
  const strongTop=gsorted[0], low=gsorted[gsorted.length-1];
  const likeSorted=STAT_KEYS.slice().sort((a,b)=>G.like[b]-G.like[a]);
  const likeTop=G.like[likeSorted[0]]>0?likeSorted[0]:null;

  const time=Date.now()-G.startTime;
  const score=scoreOf(s,G.burnout); const grade=gradeOf(score);
  const ch=decideChar(growth,tr);
  const dex=addDex(ch.id);
  const entry={id:Date.now()+"-"+Math.floor(Math.random()*1e6),nick:G.nick,score,grade,time,char:ch.name};
  const myRank=saveScore(G.seed,entry);

  const painText = G.painPick || PAIN[(s.mp<40)?"낮은멘탈":low];
  const es = energyStyle(s.mp, G.burnout);
  const fitS=FIT[strongTop];
  const likeBlock = likeTop ? `
    <div class="insight like"><div class="h">❤️ 당신이 끌리는 일</div>
      <div class="big">${FIT[likeTop].job}</div>
      <div class="side">${likeTop===strongTop?"잘하는 일과 끌리는 일이 같아요 — 천직!":`잘하는 건 <b>${fitS.job}</b>인데 마음은 <b>${FIT[likeTop].job}</b>으로 향하네요. 이런 갭도 당신의 이야기예요.`}</div>
    </div>` : "";

  el(`
  <div class="card">
    <div class="badge">20년 후 · 나의 캐릭터</div>
    <div class="charcard">
      <div class="emoji">${ch.e}</div>
      <div class="cname">${ch.name}</div>
      <div class="cdesc">${ch.desc}</div>
      <div class="grade">${grade}등급 · ${score.toLocaleString()}점</div>
    </div>

    <h2>나의 성향</h2>
    <div class="traits">
      ${traitAxis("사교","🌙 내향","외향 ☀️",tr.social)}
      ${traitAxis("자극","🪨 안정","변화 🌊",tr.novelty)}
      ${traitAxis("소속","🕊️ 자유","조직 🏢",tr.belonging)}
    </div>

    <div class="insight good"><div class="h">💪 당신이 잘하는 일</div>
      <div class="big">${fitS.job}</div>
      <div class="side">${fitS.line} — 대표 강점 ${strongTop}(+${growth[strongTop]})</div>
    </div>
    ${likeBlock}
    <div class="insight hard"><div class="h">💢 당신이 회사에서 힘든 이유</div>
      <div style="font-size:14px">${painText}</div>
    </div>

    <div class="kv"><span>번아웃(멘탈·체력 소진)</span><b>${G.burnout}회</b></div>
    <div class="kv"><span>소요 시간</span><b>${(time/1000).toFixed(1)}초</b></div>
    <h2 style="margin-top:16px">능력치 레이더</h2>
    <canvas id="radarResult" width="620" height="400" class="radar"></canvas>
    <div class="stats hpmp">${statHpMp(s)}</div>
    <div class="insight" style="background:#eef4ff;border:1px solid #d6e0f2;margin-top:10px">
      <div class="h" style="color:var(--blue-d)">${es.e} 에너지 운용 — ${es.name}</div>
      <div style="font-size:13px;color:#4a5468">${es.desc}</div>
    </div>
    <div class="row2">
      <button class="btn ghost" onclick="screenStart()">처음으로</button>
      <button class="btn ghost" onclick="start2rand()">🎲 새 문항</button>
      <button class="btn" onclick="start2()">재도전 ↻</button>
    </div>
  </div>

  <div class="card">
    <h2>📖 캐릭터 도감 (${DEX_ORDER.filter(k=>dex[k]).length}/${DEX_ORDER.length})</h2>
    <div class="dex">${DEX_ORDER.map(k=>{
      const info=BASE_CHAR[k]||SPECIAL[k]; const got=dex[k];
      return `<div class="dexcell ${got?'got':'miss'}"><div class="de">${got?info.e:"❓"}</div>
        ${got?(k==="한량"?"한량":(k==="균형"?"균형형":info.name)):"???"}${got?`<div style="font-size:10px;color:#8a94a8">×${got}</div>`:""}</div>`;
    }).join("")}</div>
  </div>

  <div class="card">
    <h2>🏆 리더보드 (${G.seed})</h2>
    ${lbTable(G.seed,entry.id)}
    <p class="muted">등급은 '얼마나 뾰족하게 키웠나'일 뿐, 어느 캐릭터가 더 낫고 나쁨은 없어요. 서로 강점이 다를 뿐!<br>※ 프로토타입은 이 브라우저에만 저장됩니다.</p>
  </div>`);
  drawRadar("radarResult", s);
}
function start2(){ newGame(G.nick,G.seed); screenTurn(); }

function lbTable(seed,meId){
  const lb=loadLB(seed).slice(0,10);
  if(!lb.length) return `<p class="sub">아직 기록이 없습니다. 첫 주자가 되어보세요!</p>`;
  return `<table><tr><th class="rank">#</th><th>닉네임</th><th>등급</th><th>캐릭터</th></tr>
    ${lb.map((e,i)=>`<tr class="${e.id===meId?'me':''}"><td class="rank">${i+1}</td>
      <td>${e.nick}</td><td><b>${e.grade||"-"}</b> ${e.score.toLocaleString()}</td>
      <td style="font-size:12px">${e.char||e.ending||"-"}</td></tr>`).join("")}
  </table>`;
}

screenStart();
</script>
</body>
